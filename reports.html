<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отчетность | Город-САД</title>
    <link href="https://fonts.googleapis.com/css?family=Montserrat&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1e5631; --secondary: #00a8a8; --accent: #ffcc00; --dark: #1a1a1a; }
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font-family: 'Montserrat', sans-serif; background: linear-gradient(rgba(255,255,255,0.75), rgba(255,255,255,0.75)), url('bg.jpg') no-repeat center bottom fixed; background-size: cover; }
        .content-wrapper { flex: 1 0 auto; }
        nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 5%; background: rgba(255, 255, 255, 0.95) !important; backdrop-filter: blur(10px); box-shadow: 0 2px 15px rgba(0,0,0,0.1); }
        .logo-area { display: flex; align-items: center; text-decoration: none; color: var(--primary); max-width: 400px; }
        .logo-area img { height: 70px; margin-right: 15px; }
        .nav-links { display: flex; gap: 25px; }
        .nav-links a { text-decoration: none; color: var(--dark); font-weight: 600; }
        
        .page-header { background: rgba(240, 240, 240, 0.8); padding: 50px 10%; text-align: center; backdrop-filter: blur(5px); }
        .doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; padding: 60px 10%; }
        .doc-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); padding: 30px; border-radius: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        .btn-doc { padding: 12px 25px; background: var(--secondary); color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        
        footer { flex-shrink: 0; background: var(--dark); color: #ccc; padding: 60px 10%; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; }
        footer img { height: 70px; }
    
/* Настройки специально для мобильных телефонов (экран меньше 768px) */
    @media (max-width: 768px) {
        /* Уменьшаем отступы секций, чтобы не тратить место */
        section { padding: 40px 5%; }

        /* Делаем заголовок на главном экране чуть меньше, чтобы он не занимал весь экран */
        .hero h1 { font-size: 2rem; }
        .hero p { font-size: 1rem; margin-top: 15px; }

        /* Уменьшаем логотип в меню и скрываем лишние надписи, если тесно */
        .logo-area img { height: 50px; }
        .logo-area div { font-size: 0.8rem; }

        /* Навигация: делаем ссылки чуть меньше и плотнее */
        .nav-links { gap: 10px; }
        .nav-links a { font-size: 0.85rem; margin-left: 10px; }

        /* Карточки: убираем огромные отступы внутри */
        .card, .program-block, .contact-form, .doc-card {
            padding: 25px;
            margin-bottom: 20px;
        }

        /* Блок помощи с QR: делаем элементы друг под другом */
        .donate-section {
            padding: 30px 5%;
            text-align: center;
        }
        .qr-box {
            margin-top: 30px;
            width: 240px; /* Чуть уменьшаем QR для мобильных */
            height: 240px;
        }
    }

    </style>

</head>
<body>
<div class="content-wrapper">
    <nav>
        <a href="index.html" class="logo-area"><img src="logo.png"><div>ГОРОД-САД<br><small>ИЗБЕРБАШ</small></div></a>
        <div class="nav-links">
            <a href="index.html">Главная</a>
            <a href="programs.html">Программы</a>
            <a href="reports.html" style="color: var(--secondary)">Отчетность</a>
            <a href="contacts.html">Контакты</a>
        </div>
    </nav>
    <div class="page-header"><h1>Документы и отчеты</h1><p>Официальные данные БАНО «Город-САД-Избербаш»</p></div>
    <div class="doc-grid">
        <div class="doc-card"><div><strong>Устав организации</strong><br><small>PDF, 14 стр.</small></div><a href="ustav.pdf" class="btn-doc" target="_blank">Открыть</a></div>
        <div class="doc-card"><div><strong>Свидетельство ИНН</strong><br><small>Скан-копия</small></div><a href="#" class="btn-doc">Скоро</a></div>
    </div>
</div>
<footer>
    <div><img src="logo.png"><p>БАНО «Город-САД-Избербаш»</p></div>
    <div style="text-align:right"><p>&copy; 2026</p></div>
</footer>
</body>
</html>
